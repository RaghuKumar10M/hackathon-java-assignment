name: Build and Test

on:
  push:
    branches:
      - '**'  # Run on push to any branch
  pull_request:
    branches:
      - '**'  # Run on pull requests to any branch

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read
  statuses: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean compile -B

      - name: Run unit tests
        run: ./mvnw test -B

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            target/surefire-reports/*.xml
          check_name: Test Results
          comment_mode: off
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/jacoco-report/

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count test results
          TOTAL_TESTS=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -o 'tests="[0-9]*"' {} \; | grep -o '[0-9]*' | awk '{s+=$1} END {print s}')
          FAILURES=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -o 'failures="[0-9]*"' {} \; | grep -o '[0-9]*' | awk '{s+=$1} END {print s}')
          ERRORS=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -o 'errors="[0-9]*"' {} \; | grep -o '[0-9]*' | awk '{s+=$1} END {print s}')
          SKIPPED=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -o 'skipped="[0-9]*"' {} \; | grep -o '[0-9]*' | awk '{s+=$1} END {print s}')
          
          PASSED=$((TOTAL_TESTS - FAILURES - ERRORS - SKIPPED))
          
          echo "**Total Tests:** ${TOTAL_TESTS:-0}" >> $GITHUB_STEP_SUMMARY
          echo "**Passed:** ✅ ${PASSED:-0}" >> $GITHUB_STEP_SUMMARY
          echo "**Failed:** ❌ ${FAILURES:-0}" >> $GITHUB_STEP_SUMMARY
          echo "**Errors:** ⚠️ ${ERRORS:-0}" >> $GITHUB_STEP_SUMMARY
          echo "**Skipped:** ⏭️ ${SKIPPED:-0}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Download the 'test-results' artifact for detailed reports and coverage data." >> $GITHUB_STEP_SUMMARY

